<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
<title id="title">SignalForge read 6,855 real videos in 293 seconds; watching them once each takes 3,558 hours</title>
<desc id="description">A 10-second animation of a run measured on 2026-11-10. SignalForge reads the public metadata of 6,855 real videos from 23 public channels while a counter runs up. Two bars compare the measured time: 293 seconds for SignalForge to collect and score them all, against 3,558 hours (148 days nonstop) for one person to watch each video once. The ratio is 43,712 times. SignalForge reads metadata; it does not watch videos.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#100c26"/><stop offset="1" stop-color="#18143b"/></linearGradient>
  <linearGradient id="fast" x1="0" x2="1"><stop stop-color="#3ddbb2"/><stop offset="1" stop-color="#80f7e3"/></linearGradient>
  <linearGradient id="slow" x1="0" x2="1"><stop stop-color="#b9792a"/><stop offset="1" stop-color="#ffdf84"/></linearGradient>
  <pattern id="dim" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="12" height="12" rx="2.5" fill="#2a2251"/></pattern>
  <pattern id="lit" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="12" height="12" rx="2.5" fill="#6f58d6"/><rect x="2.5" y="3" width="7" height="1.6" fill="#c9bbff"/><rect x="2.5" y="6.4" width="5" height="1.6" fill="#8ff0e2"/></pattern>
  <clipPath id="scan"><rect x="42" y="150" height="96" width="0"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.02;0.27;0.99;1" values="0;0;640;640;0"/></rect></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="960" height="540" rx="24" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
 <g transform="translate(35 28)">
  <path d="M21 0 4 23h13L7 46l36-31H27L34 0Z" fill="#ae84ff"/>
  <text x="52" y="31" font-size="31" font-weight="800" fill="#fff">Signal<tspan fill="#b68cff">Forge</tspan></text>
  <text x="54" y="54" font-size="14" fill="#b8b0d4">Reads the whole niche while you would still be on video one.</text>
 </g>
 <rect x="716" y="33" width="208" height="32" rx="16" fill="#123d3b" stroke="#2f8f86"/>
 <text x="820" y="54" font-size="12" font-weight="700" fill="#8ff0e2" text-anchor="middle" letter-spacing="1">MEASURED RUN · 2026-11-10</text>
 <path d="M34 100H925" stroke="#42335c"/>

 <text x="42" y="134" fill="#aa9dca" font-size="12" font-weight="700" letter-spacing="1.6">01  REAL VIDEOS READ · 23 PUBLIC CHANNELS</text>
 <rect x="42" y="150" width="640" height="96" fill="url(#dim)"/>
 <rect x="42" y="150" width="640" height="96" fill="url(#lit)" clip-path="url(#scan)"/>
 <rect x="40" y="146" width="5" height="104" rx="2.5" fill="#9ff8ec" filter="url(#glow)" opacity="0"><animate attributeName="x" dur="10s" repeatCount="indefinite" keyTimes="0;0.02;0.27;1" values="40;40;680;680"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.27;1" values="0;1;0;0"/></rect>
 <rect x="706" y="146" width="220" height="104" rx="14" fill="#1a1536" stroke="#46365f"/>
 <text x="816" y="170" text-anchor="middle" fill="#b2a6d2" font-size="13">videos read and scored</text>
 <text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#4a4270">0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.045;1" values="1;0;0"/></text>
 <text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">686<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0200;0.0450;1" values="0;1;0;0"/></text>
<text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">1,371<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0450;0.0700;1" values="0;1;0;0"/></text>
<text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">2,056<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0700;0.0950;1" values="0;1;0;0"/></text>
<text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">2,742<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0950;0.1200;1" values="0;1;0;0"/></text>
<text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">3,428<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1200;0.1450;1" values="0;1;0;0"/></text>
<text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">4,113<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1450;0.1700;1" values="0;1;0;0"/></text>
<text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">4,798<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1700;0.1950;1" values="0;1;0;0"/></text>
<text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">5,484<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1950;0.2200;1" values="0;1;0;0"/></text>
<text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">6,170<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2200;0.2450;1" values="0;1;0;0"/></text>
<text x="816" y="213" text-anchor="middle" font-size="46" font-weight="800" fill="#75e7d8" opacity="0">6,855<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2450;0.9900;1" values="0;1;0;0"/></text>
 <text x="816" y="238" text-anchor="middle" fill="#8d80ab" font-size="12">titles · views · durations · dates</text>

 <text x="42" y="286" fill="#aa9dca" font-size="12" font-weight="700" letter-spacing="1.6">02  TIME TO GET THROUGH THE SAME 6,855 VIDEOS</text>
 <text x="42" y="316" fill="#fff" font-size="16" font-weight="700">SignalForge <tspan fill="#b8b0d4" font-weight="400">collects and scores every one</tspan></text>
 <rect x="42" y="326" width="640" height="24" rx="7" fill="#221b45"/>
 <g opacity="0"><rect x="42" y="326" width="7" height="24" rx="3" fill="url(#fast)"/><text x="60" y="344" fill="#8ff0e2" font-size="16" font-weight="800">✓ done in 293 seconds</text><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.27;0.99;1" values="0;1;1;0"/></g>
 <text x="42" y="386" fill="#fff" font-size="16" font-weight="700">One person <tspan fill="#b8b0d4" font-weight="400">watches each video once</tspan></text>
 <rect x="42" y="396" width="640" height="24" rx="7" fill="#221b45"/>
 <rect x="42" y="396" width="0" height="24" rx="7" fill="url(#slow)"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.30;0.84;0.99;1" values="0;0;640;640;0"/></rect>
 <text x="42" y="437" font-size="15" fill="#f7d67e" font-weight="650" opacity="0">day 25 of 148, still watching<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3000;0.3900;1" values="0;1;0;0"/></text>
<text x="42" y="437" font-size="15" fill="#f7d67e" font-weight="650" opacity="0">day 49 of 148, still watching<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3900;0.4800;1" values="0;1;0;0"/></text>
<text x="42" y="437" font-size="15" fill="#f7d67e" font-weight="650" opacity="0">day 74 of 148, still watching<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.4800;0.5700;1" values="0;1;0;0"/></text>
<text x="42" y="437" font-size="15" fill="#f7d67e" font-weight="650" opacity="0">day 99 of 148, still watching<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5700;0.6600;1" values="0;1;0;0"/></text>
<text x="42" y="437" font-size="15" fill="#f7d67e" font-weight="650" opacity="0">day 124 of 148, still watching<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6600;0.7500;1" values="0;1;0;0"/></text>
<text x="42" y="437" font-size="15" fill="#f7d67e" font-weight="650" opacity="0">3,558 hours = 148 days nonstop<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7500;0.9900;1" values="0;1;0;0"/></text>
 <text x="42" y="462" fill="#8d80ab" font-size="12">To scale, SignalForge's bar is 0.015 of a pixel wide. It is drawn at 7 px so you can see it.</text>

 <rect x="706" y="270" width="220" height="196" rx="14" fill="#1a1536" stroke="#46365f"/>
 <text x="816" y="300" text-anchor="middle" fill="#b2a6d2" font-size="13">watch time ÷ SignalForge time</text>
 <text x="816" y="380" text-anchor="middle" fill="#4a4270" font-size="60" font-weight="800">×?<animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.84;0.99;1" values="1;0;0;1"/></text>
 <g opacity="0"><circle cx="816" cy="360" r="62" fill="#3ddbb2" opacity=".22" filter="url(#glow)"/><text x="816" y="380" text-anchor="middle" fill="#75e7d8" font-size="46" font-weight="800">×43,712</text><text x="816" y="418" text-anchor="middle" fill="#f0eaff" font-size="14" font-weight="650">faster than watching</text><text x="816" y="442" text-anchor="middle" fill="#8d80ab" font-size="12">3,558 h against 293 s</text><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.84;0.99;1" values="0;1;1;0"/></g>

 <text x="42" y="505" fill="#8d80ab" font-size="12">Real public metadata, measured 2026-11-10 on one desktop · SignalForge reads metadata, it does not watch videos · it finds what to watch first</text>
</g>
</svg>
