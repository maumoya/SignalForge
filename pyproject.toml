[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "signalforge"
version = "0.1.0"
description = "Local-first, evidence-backed signal intelligence for agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mauricio Alonso Moya Tapia"}]
dependencies = []
[project.scripts]
signalforge = "signalforge.cli:main"
[tool.setuptools.packages.find]
include = ["signalforge*"]
