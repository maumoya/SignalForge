name: Skill readiness
on:
  push:
    branches: [main]
  pull_request:
permissions: read-all
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Measure Skill Forger E2E readiness
        id: forge
        uses: maumoya/skill-forger-e2e@84911a7d2d60aca8b6db8a837d275155d1811207
        with:
          path: .
          repo: maumoya/SignalForge
          lint: "true"
          min-score: "0"
          ship-gates: "false"
      - name: Report measured score without claiming ship-ready
        env:
          FORGE_SCORE: ${{ steps.forge.outputs.score }}
        run: echo "Skill Forger E2E measured readiness score: ${FORGE_SCORE}/100; release gates are separate."
