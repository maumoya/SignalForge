name: Authorship
on:
  push:
    branches: [main]
  pull_request:
permissions: read-all
jobs:
  authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Mauricio Moya remains the sole credited author
        uses: maumoya/your-authorship-skill@be53d618b16a7818a9df6e49d5d337cd7db9a2ff
        with:
          files: "true"
