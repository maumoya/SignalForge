name: Reproducible metadata throughput
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/benchmark.py
      - signalforge/**
      - .github/workflows/benchmark.yml
  pull_request:
    paths:
      - scripts/benchmark.py
      - signalforge/**
      - .github/workflows/benchmark.yml
permissions: read-all
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Benchmark 3,000 synthetic records
        run: python scripts/benchmark.py --count 3000 --clip-seconds 60 --repeats 7 --out benchmark-results.json
      - name: Verify benchmark schema and honesty constraints
        run: |
          python - <<'PY'
          import json
          r=json.load(open("benchmark-results.json"))
          assert r["synthetic_records"]==3000
          assert r["hypothetical_total_playback_hours"]==50
          assert r["records_with_baseline"]==3000
          assert r["median_elapsed_seconds"]>0
          assert r["benchmark_type"]=="synthetic-metadata-processing-only"
          assert len(r["limitations"])>=5
          print("PASS: benchmark scope, units and evidence checked")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-json
          path: benchmark-results.json
          retention-days: 90
