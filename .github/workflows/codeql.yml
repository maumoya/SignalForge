name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '14 7 * * 4'
permissions: read-all
jobs:
  analyze:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@45775bd8235c68ba998cffa5171334d58593da47 # v3.28.13
        with:
          languages: python
      - uses: github/codeql-action/analyze@45775bd8235c68ba998cffa5171334d58593da47 # v3.28.13
